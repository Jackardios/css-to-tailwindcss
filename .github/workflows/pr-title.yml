name: PR Title

# PRs are squash-merged with the PR title as the commit subject, so the title's
# conventional type decides the release (feat → minor, fix/perf → patch).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          types='feat|fix|perf|build|ci|docs|refactor|test|chore|style|revert'
          if ! printf '%s' "$TITLE" | grep -Eq "^($types)(\([a-z0-9._/-]+\))?!?: [^ ]"; then
            echo "::error::The title must follow Conventional Commits, e.g. 'fix: keep important declarations' (types: ${types//|/, })"
            exit 1
          fi

          # A major release may only reach main or a maintenance branch from `next`
          # (the v2 cutover) or with the `release:major` label.
          # The parser matches `BREAKING CHANGE:` at the start of any body line, in any case.
          breaking=false
          if printf '%s' "$TITLE" | grep -Eq "^[a-z]+(\([^)]*\))?!:"; then breaking=true; fi
          if printf '%s\n' "$BODY" | grep -Eiq '^[[:space:]]*(\*[[:space:]]+)?breaking[ -]change:'; then breaking=true; fi
          if [[ "$breaking" == true && ( "$BASE" == main || "$BASE" =~ ^[0-9]+\.x$ ) ]] \
            && [[ "$HEAD" != next && ",$LABELS," != *",release:major,"* ]]; then
            echo "::error::This PR would release a new major version from $BASE. Remove '!' from the title and any line starting with 'BREAKING CHANGE:' from the description, or target 'next'."
            exit 1
          fi
