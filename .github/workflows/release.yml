name: Release

on:
  push:
    branches:
      - main
      # maintenance branches (1.x, 2.x, ...); `next` is added once v2 prereleases are ready
      - '[0-9]+.x'

permissions:
  contents: read

# two quick merges must not run semantic-release in parallel on the same branch
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # npm trusted publishing (OIDC), https://docs.npmjs.com/trusted-publishers
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # without `prerelease: true`, semantic-release treats `next` as a release branch
      # and would publish 2.0.0 (not 2.0.0-next.1) under the `next` dist-tag
      - name: Check release branches
        run: |
          node -e "
            const branches = require('./package.json').release.branches;
            const next = branches.find((b) => typeof b === 'object' && b.name === 'next');
            if (!next || next.prerelease !== true) {
              console.error('release.branches must contain { name: \"next\", prerelease: true }');
              process.exit(1);
            }
          "
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
